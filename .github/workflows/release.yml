name: Release

# A pull request whose title starts with "release:" is a release.
#   While it's open:  build and test, package the tarball and build the image, without publishing anything,
#                     so a broken release shows up on the PR.
#   When it's merged: the same from the merge commit, then publish:
#                     - tag v<version> and a GitHub Release with superagent-<version>.tar.gz and its .sha256
#                     - images ghcr.io/<owner>/superagent:<version> and :latest (linux/amd64 + arm64), and the
#                       CLI base image ghcr.io/<owner>/superagent-base
# The version is the one in the pom: bump it in the release PR (see README → Releasing).
# Release PRs come from a branch in this repository (a fork's PR has no permission to publish).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  release:
    if: >-
      startsWith(github.event.pull_request.title, 'release:') &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLISH: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Once merged, release exactly what landed on main.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Version
        id: version
        run: |
          version=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          # The pom comes from the PR, and the version lands in later commands: only plain version characters pass.
          if ! echo "$version" | grep -Eq '^[0-9][0-9A-Za-z.-]{0,63}$'; then
            echo "::error::The pom version isn't a plain version string"; exit 1
          fi
          case "$version" in
            *SNAPSHOT*) echo "::error::The pom version '$version' isn't a release version"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released: bump the version in the pom (mvn versions:set -DnewVersion=...)"
            exit 1
          fi
          prerelease=false
          if echo "$version" | grep -Eiq -- '-(alpha|beta|rc|m)[0-9.]*$'; then prerelease=true; fi
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/superagent
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (prerelease: $prerelease, publish: $PUBLISH)"

      - name: Build, test and package
        run: mvn -B -ntp clean install -PreleaseTgz

      - name: Checksum
        id: dist
        run: |
          mkdir -p dist
          cp "superagent-server/target/superagent-${{ steps.version.outputs.version }}.tar.gz" dist/
          cd dist
          sha256sum "superagent-${{ steps.version.outputs.version }}.tar.gz" > "superagent-${{ steps.version.outputs.version }}.tar.gz.sha256"
          cat ./*.sha256

      - name: Keep the package on this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superagent-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CLI base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: cli-base
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          build-args: CLI_REFRESH=${{ steps.version.outputs.date }}
          tags: |
            ${{ steps.version.outputs.image }}-base:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}-base:latest', steps.version.outputs.image) || '' }}
          cache-from: type=gha,scope=superagent
          cache-to: type=gha,scope=superagent,mode=max

      - name: SuperAgent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          build-args: CLI_REFRESH=${{ steps.version.outputs.date }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=superagent
          cache-to: type=gha,scope=superagent,mode=max

      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **Tarball** (Java 21+, MySQL 8):

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/superagent-${VERSION}.tar.gz
          tar -xzf superagent-${VERSION}.tar.gz && cd superagent-${VERSION}
          # set the admin password and MySQL in config/superagent.env, then:
          bin/superagent-start.sh
          \`\`\`

          **Docker** (Claude Code, Codex, Gemini, Qwen Code, Kimi Code and DeepSeek Harness preinstalled):

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          With MySQL, use [docker/docker-compose.yml](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docker/docker-compose.yml).
          EOF
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" dist/* \
            --target "$SHA" \
            --title "SuperAgent ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
