spring.application.name=superagent-server
superagent.version=@project.version@

# HTTP
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# Actuator: expose health only until real endpoints exist
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging. The line format comes from superagent-core (LogFormat.PATTERN);
# only levels are configured per application.
logging.level.root=INFO
logging.level.com.superagent=DEBUG
