spring.application.name=superagent-server
superagent.version=@project.version@

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server.port=${SERVER_PORT:8080}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.superagent=DEBUG

superagent.storage.type=mysql
superagent.agent.workspace-dir=./data/workspaces

# Initial admin for username/password login (BCrypt-hashed at startup). If the password
# is left blank, a strong one-time password is generated and logged once at startup.
# Set SUPERAGENT_ADMIN_PASSWORD to choose your own; there is no weak default.
superagent.auth.admin.username=${SUPERAGENT_ADMIN_USERNAME:admin}
superagent.auth.admin.password=${SUPERAGENT_ADMIN_PASSWORD:admin}

# Session cookie hardening (CSRF is disabled for the JSON API; SameSite is the baseline).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Task execution. The agent runs with per-tool authorization (NOT skip-all): only the
# tools in this allowlist are permitted, and skip-permissions stays false. Coding tasks
# need file + shell tools to implement and verify changes; override via the env var to
# widen/narrow. Only set skip-permissions=true inside a real isolation boundary (per-task
# container/VM, no host credentials, restricted network) — it bypasses ALL tool approval.
superagent.task.allowed-tools=${SUPERAGENT_TASK_ALLOWED_TOOLS:Read,Glob,Grep,LS,Edit,Write,Bash}
superagent.task.skip-permissions=${SUPERAGENT_TASK_SKIP_PERMISSIONS:false}
# Max tasks running in parallel per user. Prefer reusing an idle session (shared context);
# only spin up a new session when all of a user's sessions are busy, up to this cap; beyond
# it, new tasks queue until a session frees.
superagent.task.max-parallel=${SUPERAGENT_TASK_MAX_PARALLEL:50}

# GitHub OAuth app for connector authorization. Register an OAuth app and supply
# these via env; the callback below must match the app's Authorization callback URL.
superagent.oauth.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
superagent.oauth.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
superagent.oauth.github.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/oauth/github/callback}
# Absolute base URL to return to after OAuth; blank means a relative redirect to "/".
superagent.app.base-url=${SUPERAGENT_BASE_URL:}
