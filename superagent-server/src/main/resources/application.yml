spring:
  application:
    name: superagent-server
  lifecycle:
    # Each shutdown phase may take this long: task turns get superagent.task.shutdown.timeout (2 min) to finish.
    timeout-per-shutdown-phase: 3m
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  servlet:
    multipart:
      # Files attached to a chat/task message (FileService.UPLOAD_MAX_BYTES); a little slack for the form itself.
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.superagent: DEBUG

superagent:
  registration:
    # Whether the sign-in page lets anyone register an organization. Turn it off once the organizations you want exist.
    enabled: ${SUPERAGENT_REGISTRATION_ENABLED:true}
  version: @project.version@
  # Each company's default limits; 0 = unlimited. A company's own limits (company table) override these.
  tenant:
    quota:
      max-users: ${SUPERAGENT_QUOTA_MAX_USERS:0}
      max-running-tasks: ${SUPERAGENT_QUOTA_MAX_RUNNING_TASKS:0}
      monthly-tokens: ${SUPERAGENT_QUOTA_MONTHLY_TOKENS:0}
  storage:
    # Business data is always in MySQL. Analytics data (token usage, the agent run log, turn timings) is too, unless
    # this is clickhouse; then those tables alone go to superagent.storage.clickhouse.* (url, username, password).
    analytics: ${SUPERAGENT_STORAGE_ANALYTICS:mysql}
    mysql:
      url: ${SUPERAGENT_STORAGE_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/superagent?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      username: ${SUPERAGENT_STORAGE_MYSQL_USERNAME:root}
      password: ${SUPERAGENT_STORAGE_MYSQL_PASSWORD:}
  agent:
    workspace-dir: ./data/workspaces
    # How long one agent turn may run before it is stopped. A coding task's development step can take a long time;
    # a stuck turn is still stopped, just later. One value for every CLI.
    claude:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
    codex:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
    deepseek:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
    grok:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
    kimi:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
    qwen:
      timeout-seconds: ${SUPERAGENT_AGENT_TIMEOUT_SECONDS:3600}
  attachments:
    dir: ./data/attachments
  files:
    dir: ./data/files
  task:
    allowed-tools: ${SUPERAGENT_TASK_ALLOWED_TOOLS:Read,Glob,Grep,LS,Edit,Write,Bash}
    skip-permissions: ${SUPERAGENT_TASK_SKIP_PERMISSIONS:false}
    max-parallel: ${SUPERAGENT_TASK_MAX_PARALLEL:50}
    # On shutdown: how long running task turns (and local merges) get to finish before they're cut short and resumed
    # after the next start. The stop script's STOP_TIMEOUT must stay above it.
    shutdown:
      timeout: ${SUPERAGENT_TASK_SHUTDOWN_TIMEOUT:120s}
  app:
    base-url: ${SUPERAGENT_BASE_URL:}
