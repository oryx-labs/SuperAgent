spring:
  application:
    name: superagent-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  servlet:
    multipart:
      # Files attached to a chat/task message (FileService.UPLOAD_MAX_BYTES); a little slack for the form itself.
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.superagent: DEBUG

superagent:
  version: @project.version@
  # Each company's default limits; 0 = unlimited. A company's own limits (company table) override these.
  tenant:
    quota:
      max-users: ${SUPERAGENT_QUOTA_MAX_USERS:0}
      max-running-tasks: ${SUPERAGENT_QUOTA_MAX_RUNNING_TASKS:0}
      monthly-tokens: ${SUPERAGENT_QUOTA_MONTHLY_TOKENS:0}
  storage:
    type: mysql
    mysql:
      url: ${SUPERAGENT_STORAGE_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/superagent?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      username: ${SUPERAGENT_STORAGE_MYSQL_USERNAME:root}
      password: ${SUPERAGENT_STORAGE_MYSQL_PASSWORD:}
  agent:
    workspace-dir: ./data/workspaces
  attachments:
    dir: ./data/attachments
  files:
    dir: ./data/files
  auth:
    admin:
      username: ${SUPERAGENT_ADMIN_USERNAME:admin}
      password: ${SUPERAGENT_ADMIN_PASSWORD:admin}
  task:
    allowed-tools: ${SUPERAGENT_TASK_ALLOWED_TOOLS:Read,Glob,Grep,LS,Edit,Write,Bash}
    skip-permissions: ${SUPERAGENT_TASK_SKIP_PERMISSIONS:false}
    max-parallel: ${SUPERAGENT_TASK_MAX_PARALLEL:50}
  app:
    base-url: ${SUPERAGENT_BASE_URL:}
